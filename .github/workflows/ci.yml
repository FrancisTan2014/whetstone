name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (typecheck, lint, 100% coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Full source coverage
        run: pnpm test:quality

  runtime:
    name: Runtime (build, size, smoke, E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm size-limit

      - name: Dev smoke
        run: pnpm smoke

      - name: E2E smoke
        run: pnpm e2e

  isolated:
    name: Isolated contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Real process and filesystem contracts
        run: pnpm test:isolated

      - name: Delivery workflow contracts
        run: pnpm test:workflow

  python:
    name: Python worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The PDF worker suite mocks docling/torch (via sys.modules) and drives the
      # probe/convert/mapping paths through injected fakes, so it runs on the standard
      # library alone — no heavy doc-AI install. The Windows-only Job Object real-process
      # test skips cleanly on Linux; -v makes that skip (and its count) visible, so the
      # lane can never look green while silently covering nothing.
      - name: PDF worker unit tests
        run: python -m unittest discover -s src/apps/server/src/files/tests -v
