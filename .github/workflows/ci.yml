name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-lint:
    name: Quality lint (typecheck, lint)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      - name: Get pnpm store directory
        id: pnpm-cache-dir
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # side-effects-cache reuses a package's cached (pre/post)install script output across
      # runs. wordpos's postinstall writes generated index files into wordnet-db's own
      # node_modules directory (a cross-package side effect); restoring that from a cached
      # store can skip the write and leave wordnet-db's dict/ incomplete. Disabling it keeps
      # the safe part of caching (package contents) and always re-runs install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --side-effects-cache=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  quality-coverage:
    name: Quality coverage (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      - name: Get pnpm store directory
        id: pnpm-cache-dir
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # side-effects-cache reuses a package's cached (pre/post)install script output across
      # runs. wordpos's postinstall writes generated index files into wordnet-db's own
      # node_modules directory (a cross-package side effect); restoring that from a cached
      # store can skip the write and leave wordnet-db's dict/ incomplete. Disabling it keeps
      # the safe part of caching (package contents) and always re-runs install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --side-effects-cache=false

      # Each shard writes its raw v8 coverage into a blob (.vitest-reports/blob-<i>-4.json)
      # instead of enforcing the global 100% threshold immediately — a shard only ever sees a
      # slice of the suite, so its own coverage is expected to be incomplete. The `quality` job
      # merges every shard's blob and evaluates the real thresholds from vitest.config.ts once
      # the full picture is back together.
      - name: Coverage shard ${{ matrix.shard }}/4
        run: pnpm test:quality:shard --shard=${{ matrix.shard }}/4

      - name: Upload coverage shard report
        uses: actions/upload-artifact@v4
        with:
          name: quality-coverage-shard-${{ matrix.shard }}
          path: .vitest-reports
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  quality:
    name: Quality (typecheck, lint, 100% coverage)
    needs: [quality-lint, quality-coverage]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      # `needs:` alone would let a failed dependency SKIP this job (a skipped required check
      # reads as passing to the deterministic merge gate, scripts/delivery/workflow.mjs). Fail
      # this job outright instead of skipping it, so a lint/typecheck or shard failure always
      # surfaces as a failing "Quality (typecheck, lint, 100% coverage)" check.
      - name: Verify lint and coverage shards succeeded
        if: needs.quality-lint.result != 'success' || needs.quality-coverage.result != 'success'
        run: |
          echo "quality-lint: ${{ needs.quality-lint.result }}" >&2
          echo "quality-coverage: ${{ needs.quality-coverage.result }}" >&2
          exit 1

      - name: Get pnpm store directory
        id: pnpm-cache-dir
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # side-effects-cache reuses a package's cached (pre/post)install script output across
      # runs. wordpos's postinstall writes generated index files into wordnet-db's own
      # node_modules directory (a cross-package side effect); restoring that from a cached
      # store can skip the write and leave wordnet-db's dict/ incomplete. Disabling it keeps
      # the safe part of caching (package contents) and always re-runs install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --side-effects-cache=false

      - name: Download coverage shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: quality-coverage-shard-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge coverage shards and enforce 100% threshold
        run: pnpm test:quality:merge

  runtime:
    name: Runtime (build, size, smoke, E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      - name: Get pnpm store directory
        id: pnpm-cache-dir
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # side-effects-cache reuses a package's cached (pre/post)install script output across
      # runs. wordpos's postinstall writes generated index files into wordnet-db's own
      # node_modules directory (a cross-package side effect); restoring that from a cached
      # store can skip the write and leave wordnet-db's dict/ incomplete. Disabling it keeps
      # the safe part of caching (package contents) and always re-runs install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --side-effects-cache=false

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm size-limit

      - name: Dev smoke
        run: pnpm smoke

      - name: E2E smoke
        run: pnpm e2e

  isolated:
    name: Isolated contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # Corepack lazily downloads the pinned pnpm on first use; a transient
          # registry 5xx there fails the whole lane, so pre-warm it with retries.
          for attempt in 1 2 3 4 5; do
            if corepack prepare --activate; then
              exit 0
            fi
            echo "corepack prepare pnpm failed (attempt ${attempt}/5); retrying in 15s" >&2
            sleep 15
          done
          echo "corepack prepare pnpm failed after 5 attempts" >&2
          exit 1

      - name: Get pnpm store directory
        id: pnpm-cache-dir
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # side-effects-cache reuses a package's cached (pre/post)install script output across
      # runs. wordpos's postinstall writes generated index files into wordnet-db's own
      # node_modules directory (a cross-package side effect); restoring that from a cached
      # store can skip the write and leave wordnet-db's dict/ incomplete. Disabling it keeps
      # the safe part of caching (package contents) and always re-runs install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --side-effects-cache=false

      - name: Real process and filesystem contracts
        run: pnpm test:isolated

      - name: Delivery workflow contracts
        run: pnpm test:workflow

  python:
    name: Python worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The PDF worker suite mocks docling/torch (via sys.modules) and drives the
      # probe/convert/mapping paths through injected fakes, so it runs on the standard
      # library alone — no heavy doc-AI install. The Windows-only Job Object real-process
      # test skips cleanly on Linux; -v makes that skip (and its count) visible, so the
      # lane can never look green while silently covering nothing.
      - name: PDF worker unit tests
        run: python -m unittest discover -s src/apps/server/src/files/tests -v
