[package]
name = "whetstone-desktop"
version = "0.1.0"
description = "Whetstone desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "whetstone_desktop"
path = "src/lib.rs"

[[bin]]
name = "whetstone-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
