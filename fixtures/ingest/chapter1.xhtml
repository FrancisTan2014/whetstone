    <div class="sect1" id="ch1_figures">
      <h1>Foundations</h1>
      <p>The North Wind and the Sun disputed as to which was the most powerful, and agreed on a contest.</p>
      <p>The keener the blasts of the North Wind, the closer the traveler wrapped his cloak around him.</p>
      <p>Persuasion is often more effective than force, as the gentle Sun proved that day.</p>
